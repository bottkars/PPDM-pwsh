components:
  headers:
    content-language:
      description: The language code is used to describe the language(s) intended for the audience, so users can differentiate it according to their own preferred language. The default is en-US.
      schema:
        type: string
  parameters:
    accept-language:
      description: The language code indicates the natural language and locale that the client prefers. The default is en-US.
      in: header
      name: Accept-Language
      required: false
      schema:
        type: string
    async:
      description: Indicates whether to make a synchronous or an asynchronous API call.
      in: query
      name: async
      required: false
      schema:
        default: 'true'
        type: string
    filter:
      allowEmptyValue: true
      description: The filter string that is expressed using PowerProtect Data Manager filter syntax. Under Tasks, see Filter the result.
      in: query
      name: filter
      schema:
        type: string
    groupBy:
      allowEmptyValue: true
      description: Group By option.
      in: query
      name: groupBy
      schema:
        type: string
    orderby:
      allowEmptyValue: true
      description: The attributes and fields to sort by. This parameter can combine with sort direction "ASC" or "DESC". Default direction is ASC. Under Tasks, see Sort the result.
      in: query
      name: orderby
      schema:
        type: string
    page:
      allowEmptyValue: true
      description: The page number to be returned. Must not be less than 1. Under Tasks, see Page the result.
      in: query
      name: page
      schema:
        default: 1
        maximum: 10000
        minimum: 1
        type: integer
    pageSize:
      allowEmptyValue: true
      description: The number of resources to be returned. Must not be less than 1. Under Tasks, see Page the result.
      in: query
      name: pageSize
      schema:
        default: 100
        maximum: 10000
        minimum: 1
        type: integer
    queryState:
      allowEmptyValue: true
      description: Token string to retrieve the next page of a result. The initial search request with queryState must be queryState=BEGIN and a pageSize. After a search begins, subsequent responses include a token string to pass as a parameter for the next page retrieval. When the query state in the response that is returned from the previous search is END, no further results can be retrieved from this query. For more details, under Tasks, see Page the result.
      in: query
      name: queryState
      schema:
        type: string
    scope:
      description: Indicates the enum values of the service info scope. The value, SINGLE returns the info for the current micro service instance. The value, ALL returns the aggregated info for all instances of that micro service.
      in: query
      name: scope
      required: false
      schema:
        default: SINGLE
        enum:
        - SINGLE
        - ALL
        type: string
    searchTerm:
      allowEmptyValue: true
      description: A general search text.
      in: query
      name: searchTerm
      schema:
        type: string
    view:
      description: The view type.
      in: query
      name: view
      schema:
        enum:
        - FULL
        - BASIC
        - UI
        type: string
  schemas:
    AccessLevel:
      description: The access permissions for the SNMP users and communities.
      enum:
      - READ_ONLY
      - READ_WRITE
      type: string
    ActivitiesPage:
      description: Activity steps page.
      properties:
        content:
          items:
            $ref: '#/components/schemas/Activity'
          type: array
        page:
          $ref: '#/components/schemas/PageInfo'
      title: ActivitiesPage
      type: object
    Activity:
      description: An activity represents a long-running asynchronous execution in the system. It can represent a group of jobs, a single job, or a single task.
      properties:
        aggregationInfo:
          $ref: '#/components/schemas/AggregationInfo'
          x-ppdm-filter: true
          x-ppdm-sort: true
        ancestryId:
          description: Top level activity identifier.
          nullable: false
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: false
        category:
          $ref: '#/components/schemas/ActivityCategory'
        childStateMetrics:
          $ref: '#/components/schemas/StateMetrics'
        classType:
          $ref: '#/components/schemas/ActivityClassType'
        completedAt:
          description: The date and time when the activity is completed, in ISO 8601 date format.
          format: date-time
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        createdAt:
          description: The date and time when the activity is created, in ISO 8601 date format.
          format: date-time
          nullable: false
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        description:
          description: Activity description.
          nullable: false
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        displayId:
          description: User friendly activity identifier representation.
          nullable: false
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: false
        groupingInfos:
          description: The available grouping options for this activity.
          items:
            $ref: '#/components/schemas/GroupingInfo'
          type: array
        hasChildren:
          description: Indicates whether the activity has a child. If the activity has a child, this parameter is set to true.
          type: boolean
          x-ppdm-filter: true
          x-ppdm-sort: true
        id:
          description: Unique activity identifier.
          nullable: false
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: false
        initiatedType:
          $ref: '#/components/schemas/ActivityInitiatedType'
        log:
          $ref: '#/components/schemas/ActivityLogInfo'
        parentId:
          description: Direct parent activity identifier, if present.
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: false
        progress:
          description: Value between 0 and 100 representing completion percentage of this activity.
          exclusiveMaximum: false
          maximum: 100
          minimum: 0
          nullable: false
          type: integer
          x-ppdm-filter: false
          x-ppdm-sort: true
        references:
          description: The list of references for this activity.
          items:
            $ref: '#/components/schemas/ResourceReference'
          nullable: false
          type: array
          x-ppdm-filter: true
          x-ppdm-sort: true
        result:
          $ref: '#/components/schemas/ActivityResult'
        scheduleInfo:
          $ref: '#/components/schemas/ActivityScheduleInfo'
        sourceActivity:
          $ref: '#/components/schemas/SourceActivity'
        sourceComponent:
          $ref: '#/components/schemas/ActivitySourceComponent'
        startedAt:
          description: The date and time when the activity is started, in ISO 8601 date format.
          format: date-time
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        state:
          $ref: '#/components/schemas/ActivityState'
        stateDetails:
          $ref: '#/components/schemas/ActivityStateDetails'
        stateTimeouts:
          description: Non-responsiveness timeout values per state. The timeout values are in minutes.
          items:
            $ref: '#/components/schemas/StateTimeout'
          type: array
          uniqueItems: true
          x-ppdm-filter: true
          x-ppdm-sort: true
        statistics:
          $ref: '#/components/schemas/ActivityStatistics'
          x-ppdm-filter: true
          x-ppdm-sort: true
        subcategory:
          $ref: '#/components/schemas/ActivitySubcategory'
        supportedActions:
          description: List of supported actions that can be performed on this activity.
          items:
            $ref: '#/components/schemas/ActivityAction'
          type: array
          uniqueItems: true
          x-ppdm-filter: true
          x-ppdm-sort: false
        system:
          $ref: '#/components/schemas/ActivitySystem'
          x-ppdm-filter: true
          x-ppdm-sort: true
        throttlingInfo:
          $ref: '#/components/schemas/ThrottlingInfo'
        updatedAt:
          description: The most recent date and time when the activity is updated, in ISO 8601 date format.
          format: date-time
          nullable: false
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        userNote:
          $ref: '#/components/schemas/ActivityUserNote'
      required:
      - id
      - displayId
      - ancestryId
      - progress
      - classType
      - category
      - supportedActions
      - references
      - state
      - description
      - sourceComponent
      - hasChildren
      title: Activity
      type: object
    ActivityAction:
      description: An action that can be performed on an activity.
      enum:
      - RETRY
      - CANCEL
      - CANCEL_ON_MAINTENANCE
      title: ActivityAction
      type: string
    ActivityCategoriesResponse:
      description: Activity categories response.
      properties:
        content:
          items:
            $ref: '#/components/schemas/ActivityCategoryModel'
          type: array
        page:
          $ref: '#/components/schemas/PageInfo'
      title: ActivityCategoriesResponse
      type: object
    ActivityCategory:
      description: The enum value associated with the activity category.
      enum:
      - ARCHIVE
      - BACKUP
      - CLOUD_PROTECT
      - CLOUD_TIER
      - CONFIG
      - DELETE
      - DISASTER_RECOVERY
      - DISCOVERY
      - EXPORT
      - MANAGE
      - MIGRATE
      - PUSH_UPDATE
      - REPLICATE
      - RESTORE
      - SYSTEM
      - VALIDATE
      - INDEX
      - GARBAGE_COLLECTION
      - DATA_MOVEMENT
      - ANOMALY_DETECTION
      - SECURITY
      title: ActivityCategory
      type: string
    ActivityCategoryBucket:
      description: The enum of activity category buckets associated with an activity category.
      enum:
      - SYSTEM
      - PROTECTION
      - RESTORE
      - INTERNAL
      title: ActivityCategoryBucket
      type: string
    ActivityCategoryModel:
      description: The activity category (ActivityCategory), a label and a category buckets that are associated with this activity category.
      properties:
        buckets:
          items:
            $ref: '#/components/schemas/ActivityCategoryBucket'
          type: array
        category:
          $ref: '#/components/schemas/ActivityCategory'
        label:
          type: string
      title: ActivityCategoryModel
      type: object
    ActivityClassType:
      description: The Activity ClassType enum.
      enum:
      - JOB_GROUP
      - JOB
      - TASK
      title: ActivityClassType
      type: string
    ActivityInitiatedType:
      description: The initiated type of a job or a job group activity, as required for the job or job group activity.
      enum:
      - MANUAL
      - RETRIED
      - SCHEDULED
      - SELF_SERVICE
      - SYSTEM
      title: ActivityInitiatedType
      type: string
    ActivityInitiatedTypeModel:
      description: The activity initiated type (ActivityInitiatedType) and label that are associated with this activity initiated type.
      properties:
        activityInitiatedType:
          $ref: '#/components/schemas/ActivityInitiatedType'
        label:
          type: string
      title: ActivityInitiatedTypeModel
      type: object
    ActivityInitiatedTypesResponse:
      description: The activity initiated type collection.
      properties:
        content:
          items:
            $ref: '#/components/schemas/ActivityInitiatedTypeModel'
          type: array
        page:
          $ref: '#/components/schemas/PageInfo'
      title: ActivityInitiatedTypesResponse
      type: object
    ActivityInterventionResponse:
      properties:
        activityId:
          description: Activity identifier
          type: string
      required:
      - activityId
      title: ActivityInterventionResponse
      type: object
    ActivityInterventionResponseBatch:
      description: The collection of activities that were modified as part of a batch intervention operation.
      properties:
        responses:
          description: The array of response objects for each of intervention requests.
          items:
            $ref: '#/components/schemas/ActivityInterventionResponseItem'
          type: array
      required:
      - responses
      title: ActivityInterventionResponseBatch
      type: object
    ActivityInterventionResponseItem:
      description: The result of a single activity batch intervention request.
      properties:
        body:
          allOf:
          - $ref: '#/components/schemas/ActivityInterventionResponse'
          - $ref: '#/components/schemas/ErrorMessage'
        id:
          description: The ID as it was specified in the request.
          type: string
        status:
          description: The HTTP response code for the request.
          type: integer
      required:
      - id
      - status
      - body
      title: ActivityInterventionResponseItem
      type: object
    ActivityIssue:
      description: The activity issue compliant with the EEMI message structure.
      properties:
        details:
          description: The detailed description defined by the EEMI message catalog.
          type: string
          x-ppdm-filter: false
          x-ppdm-sort: false
        message:
          description: The message defined by EEMI message catalog filled with the relevant message arguments.
          type: string
          x-ppdm-filter: false
          x-ppdm-sort: false
        messageArgs:
          description: The EEMI issue message arguments.
          items:
            type: string
          type: array
          x-ppdm-filter: false
          x-ppdm-sort: false
        messageId:
          description: EEMI conformed message ID.
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        raiseAlert:
          description: Indicates whether to create alert or not.
          type: boolean
          x-ppdm-filter: true
          x-ppdm-sort: true
        responseAction:
          description: The response action defined by the EEMI message catalog.
          type: string
          x-ppdm-filter: false
          x-ppdm-sort: false
      required:
      - message
      - raiseAlert
      - messageArgs
      - messageId
      title: ActivityIssue
      type: object
    ActivityLogInfo:
      description: The activity tracing and log information.
      properties:
        correlationContext:
          description: The activity log correlation context.
          type: string
          x-ppdm-filter: false
          x-ppdm-sort: false
        location:
          description: The activity log file information.
          type: string
          x-ppdm-filter: false
          x-ppdm-sort: false
      title: ActivityLogInfo
      type: object
      x-tags:
      - ActivityLogInfo resource
    ActivityMetricModel:
      description: The model for an activity state or the status metric.
      properties:
        count:
          description: The number of activities in the given state or status.
          format: int64
          type: integer
        name:
          $ref: '#/components/schemas/ActivityMetricName'
        percentage:
          description: The percentage of the activities at the given state or status, relative to the total amount of activities returned in this response.
          format: double
          type: number
      title: ActivityMetricModel
      type: object
    ActivityMetricName:
      description: The name of the metrics object that represents an activity state or the status.
      enum:
      - QUEUED
      - RUNNING
      - CANCELING
      - COMPLETED
      - RETRYING
      - SUCCESS
      - CANCELED
      - FAILED
      - COMPLETED_WITH_EXCEPTIONS
      - SKIPPED
      - TOTAL
      title: ActivityMetricName
      type: string
    ActivityMetrics:
      description: An activity metric presents a list of activity state and status counts for a collection of activities within a time interval.
      properties:
        fromCreateTime:
          description: The create time of the oldest activity in this time interval.
          format: date-time
          type: string
        stateAndStatusCount:
          description: The array of the status and the state counts for the activities in the time interval.
          items:
            $ref: '#/components/schemas/ActivityMetricModel'
          type: array
        toCreateTime:
          description: The create time of the newest activity in this time interval.
          format: date-time
          type: string
      title: ActivityMetrics
      type: object
    ActivityResult:
      description: Represents the activity result.
      properties:
        issues:
          description: List of the EEMI compliant message structure.
          items:
            $ref: '#/components/schemas/ActivityIssue'
          type: array
        status:
          $ref: '#/components/schemas/ActivityStatus'
        summaries:
          description: The detailed activity summary.
          items:
            type: string
          type: array
          x-ppdm-filter: false
          x-ppdm-sort: false
      title: ActivityResult
      type: object
    ActivityScheduleInfo:
      description: Activity schedule information.
      properties:
        description:
          description: Activity schedule information.
          type: string
          x-ppdm-filter: false
          x-ppdm-sort: false
        nextScheduledTime:
          description: The next time that the activity is scheduled.
          format: date-time
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        type:
          $ref: '#/components/schemas/ActivityScheduleType'
          x-ppdm-filter: true
          x-ppdm-sort: true
      title: ActivityScheduleInfo
      type: object
    ActivityScheduleType:
      description: The schedule type of the activity.
      enum:
      - MINUTELY
      - HOURLY
      - DAILY
      - WEEKLY
      - MONTHLY
      - YEARLY
      title: ActivityScheduleType
      type: string
    ActivitySourceComponent:
      description: The activity source component information.
      properties:
        id:
          description: The source component unique identifier.
          type: string
        type:
          $ref: '#/components/schemas/SourceComponentType'
      required:
      - type
      title: ActivitySourceComponent
      type: object
    ActivityState:
      description: The state of the activity.
      enum:
      - COMPLETED
      - CANCELING
      - RETRYING
      - QUEUED
      - RUNNING
      title: ActivityState
      type: string
    ActivityStateDetails:
      description: Detailed state information.
      properties:
        message:
          description: Extended state details.
          type: string
          x-ppdm-filter: false
          x-ppdm-sort: false
        stateHistory:
          description: List of the activity state transitions.
          items:
            $ref: '#/components/schemas/ActivityStateRecord'
          type: array
          x-ppdm-filter: true
          x-ppdm-sort: true
      title: ActivityStateDetails
      type: object
    ActivityStateRecord:
      description: Represents past activity states.
      properties:
        state:
          $ref: '#/components/schemas/ActivityState'
        updatedAt:
          description: State update time.
          format: date-time
          nullable: false
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
      title: ActivityStateRecord
      type: object
    ActivityStatistics:
      description: Activity statistics.
      properties:
        assetSizeInBytes:
          description: The average asset size in bytes over the number of protected assets.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        bytesTransferred:
          description: The total amount of data transferred to storage.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        bytesTransferredPerSecond:
          description: The average bytes transferred per second for the successfully completed activities over the number of assets.
          format: double
          type: number
          x-ppdm-filter: true
          x-ppdm-sort: true
        dedupeRatio:
          description: Pre-compression bytes divided by post-compression bytes.
          format: double
          type: number
          x-ppdm-filter: true
          x-ppdm-sort: true
        numberOfAssets:
          description: Total number of assets being processed.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        postCompressionBytes:
          description: The total amount of data written to storage post compression.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        priorCompressionBytes:
          description: The total amount of data written/read to/from Boost SDK for backup/restore prior to compression.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        reductionPercentage:
          description: Calculated as (1-postCompBytes/preCompBytes)*100.
          format: double
          type: number
          x-ppdm-filter: true
          x-ppdm-sort: true
        runDurationMillis:
          description: The runtime duration of the activity, measured in milliseconds.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        storageCompStats:
          $ref: '#/components/schemas/ActivityStorageCompStats'
          x-ppdm-filter: true
          x-ppdm-sort: true
      title: ActivityStatistics
      type: object
    ActivityStatus:
      description: The Activity Status.
      enum:
      - SUCCESS
      - COMPLETED_WITH_EXCEPTIONS
      - FAILED
      - CANCELED
      - SKIPPED
      - RETRIED
      title: ActivityStatus
      type: string
    ActivityStep:
      description: Activity Steps are subtasks of activity, dynamically created and updated by an activity owner choice
      properties:
        completedAt:
          description: The completion time of the activity step. Follows ISO8601 date format.
          format: date-time
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        createdAt:
          description: The create time of the activity step. Follows ISO8601 date format.
          format: date-time
          nullable: false
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        description:
          description: Activity step description.
          nullable: false
          type: string
          x-ppdm-filter: false
          x-ppdm-sort: false
        durationInMillis:
          description: Step duration time in milliseconds.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        id:
          description: Unique activity step identifier.
          nullable: false
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: false
        parentActivityId:
          description: Parent activity identifier.
          nullable: false
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: false
        startedAt:
          description: The start time of the activity step. Follows ISO8601 date format.
          format: date-time
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        stateDetails:
          $ref: '#/components/schemas/ActivityStepStateDetails'
        updatedAt:
          description: The last update time of the activity step. Follows ISO8601 date format.
          format: date-time
          nullable: false
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
      required:
      - id
      - parentActivityId
      - description
      - stateDetails
      title: ActivityStep
      type: object
    ActivityStepStateDetails:
      description: Current activity step state details.
      properties:
        message:
          description: Extended state details.
          type: string
          x-ppdm-filter: false
          x-ppdm-sort: false
        progress:
          description: Value between 0 and 100 representing completion percentage of this step.
          exclusiveMaximum: false
          maximum: 100
          minimum: 0
          nullable: false
          type: integer
          x-ppdm-filter: false
          x-ppdm-sort: false
        status:
          $ref: '#/components/schemas/ActivityStepStatus'
      title: ActivityStepStateDetails
      type: object
    ActivityStepStatus:
      description: The activity step status enum.
      enum:
      - QUEUED
      - RUNNING
      - SUCCESS
      - COMPLETED_WITH_EXCEPTIONS
      - FAILED
      - CANCELED
      - SKIPPED
      title: ActivityStepStatus
      type: string
    ActivityStepsPage:
      description: A page of activity steps.
      properties:
        content:
          items:
            $ref: '#/components/schemas/ActivityStep'
          type: array
        page:
          $ref: '#/components/schemas/PageInfo'
      title: ActivityStepsPage
      type: object
    ActivityStorageCompStats:
      description: The storage statistics report.
      properties:
        cumulativeSizeInBytes:
          description: Cumulative file size.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        dedupedPreCompSizeInBytes:
          description: Size after removing duplication and before local compression.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        redundantSegmentsCount:
          description: Redundant segments (already existing on protection storage) in file.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        segmentsCount:
          description: Total segments in file.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
      title: ActivityStorageCompStats
      type: object
    ActivitySubcategoriesResponse:
      description: Activity subcategories response.
      properties:
        content:
          items:
            $ref: '#/components/schemas/ActivitySubcategoryModel'
          type: array
        page:
          $ref: '#/components/schemas/PageInfo'
      title: ActivitySubcategoriesResponse
      type: object
    ActivitySubcategory:
      description: The enum of subcategories associated with an activity category.
      enum:
      - AGENT_MAINTENANCE
      - APP_HOST_DECOMMISSION
      - ASSET_AND_COPY
      - ASSET_CONFIGURATION
      - ASSET_SOURCE
      - ASSET_RESUME
      - ASSET_UNCONFIGURATION
      - CATALOG
      - CLEANUP
      - COMPLIANCE
      - COPY
      - COPY_DELETION
      - CLOUD_COPY
      - CUMULATIVE
      - CYBER_UPDATE
      - DATA_AND_CATALOG
      - DATA_DELETE
      - DEPLOYMENT
      - DEPLOY_CDRA
      - DEPLOY_CDRS
      - CDR_STAGE
      - REMOVE_CLOUD_DR
      - DIFFERENTIAL
      - DISASTER_RECOVERY
      - EXPIRED
      - FLR
      - FLR_TO_ALTERNATE
      - FLR_TO_PRODUCTION
      - FROM_REPLICA
      - FULL
      - HEALTH_CHECK
      - HOST
      - HOST_CATALOG_CHANGE_STATUS
      - INCREMENTAL
      - INSTANT_ACCESS
      - INSTANT_ACCESS_ATTACH
      - INSTANT_ACCESS_DETACH
      - INSTANT_ACCESS_DELETE_SESSION
      - IR_TO_ALTERNATE
      - IR_TO_ORIGINAL
      - LEVEL
      - LOG
      - LOG_BUNDLE
      - LOG_EXPORT
      - MANUAL_SELECTED_COPY
      - POWER_OFF
      - POWER_ON
      - PRECHECK
      - PROTECTION_ENGINE
      - PUSH_UPDATE
      - OBJECT
      - QUICK_RECOVERY
      - REPORT_ENGINE
      - SEARCH_ENGINE
      - SERVER_DR
      - SHUT_DOWN_SERVICES
      - SOFTWARE_UPDATE
      - STORAGE_UNIT
      - STORAGE_UNIT_DELETION
      - TO_ALTERNATE
      - TO_CLOUD
      - TO_EXPORT
      - TO_MOUNT
      - TO_ORIGINAL
      - TO_PRODUCTION
      - VHD_TO_ALTERNATE
