      description: The update request body of a SNMP user (supports both SNMPv2c and SNMPv3).
      properties:
        accessLevel:
          $ref: '#/components/schemas/AccessLevel'
        authenticationKey:
          description: The password for SNMPv3 authentication(8-40 characters).
          format: password
          maxLength: 40
          minLength: 8
          type: string
        authenticationProtocolType:
          $ref: '#/components/schemas/AuthenticationProtocolType'
        privacyKey:
          description: The password for SNMPv3 privacy (8-40 characters).
          format: password
          maxLength: 40
          minLength: 8
          type: string
        privacyProtocolType:
          $ref: '#/components/schemas/PrivacyProtocolType'
        username:
          description: The SNMP username for SNMPv3, with a minimum of 8 characters.
          minLength: 8
          type: string
      type: object
    SnmpVersion:
      default: SNMPv3
      description: The SNMP protocol version.
      enum:
      - SNMPv2c
      - SNMPv3
      type: string
    Source:
      description: The objects (assets or asset groups) that we want to protect.
      properties:
        assetIds:
          description: The list of asset IDs that require protection.
          items:
            type: string
          type: array
        protectionGroupIds:
          description: The list of protection group IDs that require protection.
          items:
            type: string
          type: array
      title: Source
      type: object
    SourceActivity:
      description: The source activity information.
      properties:
        id:
          description: The source activity ID.
          nullable: false
          type: string
      required:
      - id
      title: SourceActivity
      type: object
    SourceComponentType:
      description: The source component type enum.
      enum:
      - DATA_MANAGER
      - OPERATING_ENVIRONMENT
      - PROTECTION_STORAGE
      title: SourceComponentType
      type: string
    StateMetrics:
      description: The count of child activities in each state and status.
      properties:
        canceled:
          description: The count of child activities in canceled status.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        canceling:
          description: The count of child activities in canceling state.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        completed:
          description: The count of child activities in completed state.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        completedWithExceptions:
          description: The count of child activities is completed with exceptions status.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        criticalEvent:
          description: The count of child activities in the critical status (failed/completedWithExceptions/canceled).
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        failed:
          description: The count of child activities in failed status.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        queued:
          description: The count of child activities in queued state.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        retrying:
          description: The count of child activities in retrying state.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        running:
          description: The count of child activities in running state.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        skipped:
          description: The count of child activities in skipped status.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        success:
          description: The count of child activities in success status.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
        total:
          description: The total count of the child activities.
          format: int64
          type: integer
          x-ppdm-filter: true
          x-ppdm-sort: true
      title: StateMetrics
      type: object
    StateTimeout:
      description: A state-specific timeout value for non-responsiveness.
      properties:
        expireAfter:
          description: The timeout value in minutes.
          type: integer
        state:
          description: The enum value associated with the activity state.
          enum:
          - CANCELING
          - RETRYING
          - QUEUED
          - RUNNING
          type: string
      required:
      - state
      - expireAfter
      title: StateTimeout
      type: object
    StorageContainerRef:
      properties:
        id:
          description: The storage container ID.
          type: string
          x-ppdm-filter: false
          x-ppdm-sort: false
      title: StorageContainerRef
      type: object
      x-tags:
      - Resource
    StorageDetailWithName:
      properties:
        arraySerialNo:
          description: The storage array serial number.
          type: string
        arraySubType:
          $ref: '#/components/schemas/StorageSystemSubType'
        storageClass:
          description: The storage class.
          type: string
        storageContainerRef:
          $ref: '#/components/schemas/StorageContainerRef'
        storageGroupId:
          description: The storage group ID.
          type: string
        storageTargetRef:
          $ref: '#/components/schemas/StorageTargetRefWithName'
      title: StorageDetail
      type: object
    StorageSourceType:
      description: The storage source type.
      enum:
      - STORAGE_CONTAINER
      - VOLUME_GROUP
      title: Storage Source Type
      type: string
      x-ppdm-filter: true
      x-ppdm-sort: true
    StorageSystemSubType:
      description: The storage array subtype.
      enum:
      - DATADOMAINSYSTEM
      - CDRREGIONSYSTEM
      - UNITYAPPLIANCE
      - POWERSTOREAPPLIANCE
      - POWERSCALEAPPLIANCE
      - GENERICNASAPPLIANCE
      - DATADOMAINAPPLIANCEPOOL
      - POWERMAXSTORAGESYSTEM
      type: string
      x-ppdm-filter: true
      x-ppdm-sort: true
    StorageTargetRefWithName:
      properties:
        id:
          description: The data target ID.
          type: string
          x-ppdm-filter: false
          x-ppdm-sort: false
        name:
          description: The data target name.
          type: string
          x-ppdm-filter: false
          x-ppdm-sort: false
        namespace:
          description: Indicates the folder under the storage unit where the backup/catalog files are uploaded.
          type: string
      title: StorageTargetRef
      type: object
    ThrottlingInfo:
      description: Provides details of the throttling that is performed during activity execution.
      properties:
        enabled:
          description: Indicates if throttling is enabled for an activity in either the PowerProtect agent service or in the application.
          type: boolean
          x-ppdm-filter: true
          x-ppdm-sort: true
      title: ThrottlingInfo
      type: object
    TierAfter:
      allOf:
      - $ref: '#/components/schemas/ProtectionTierAfter'
      description: Specify the time when DD should move data to cloud tier.
      type: object
    TieringDetail:
      description: The detailed information of cloud tier.
      properties:
        cloudProfile:
          description: The cloud profile.
          type: string
        cloudUnit:
          description: The cloud unit.
          type: string
        recalledAt:
          description: The time when this copy is recalled, that is persisted with millisecond-level. For example, a time value such as '2024-03-19T14:15:123456789Z' would be truncated to '2024-03-19T14:15:123Z'.
          format: date-time
          type: string
        retentionTimeAfterRecall:
          description: The retention time of this copy after recall, that is persisted with millisecond-level. For example, a time value such as '2024-03-19T14:15:123456789Z' would be truncated to '2024-03-19T14:15:123Z'.
          format: date-time
          type: string
        retieredAt:
          description: The time when this copy is retiered, that is persisted with millisecond-level. For example, a time value such as '2024-03-19T14:15:123456789Z' would be truncated to '2024-03-19T14:15:123Z'.
          format: date-time
          type: string
        stageId:
          description: The stage ID.
          type: string
        tieredAt:
          description: The time when this copy is tiered, that is persisted with millisecond-level. For example, a time value such as '2024-03-19T14:15:123456789Z' would be truncated to '2024-03-19T14:15:123Z'.
          format: date-time
          type: string
      title: TieringDetail
      type: object
      x-tags:
      - Resource
    TransportMode:
      description: The transport mode that is used to transfer the data.
      enum:
      - NBD
      - HOTADD
      - TSDM
      - NBDSSL
      - ISCSI
      title: Transport Mode
      type: string
      x-ppdm-filter: true
      x-ppdm-sort: true
    TriggerType:
      description: Indicate the copy is generated by manual or scheduled backup.
      enum:
      - AD_HOC
      - SCHEDULED
      type: string
      x-ppdm-filter: true
      x-ppdm-sort: true
    UnavailableReason:
      properties:
        description:
          description: The text that describe why the copy is unavailable.
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        type:
          $ref: '#/components/schemas/CopyUnavailableType'
      title: UnavailableReason
      type: object
      x-tags:
      - Resource
    Visibility:
      description: Health entity visibility.
      enum:
      - INTERNAL
      - PUBLIC
      title: Visibility
      type: string
    VmCopy:
      allOf:
      - $ref: '#/components/schemas/CommonCopy'
      - properties:
          extendedData:
            $ref: '#/components/schemas/VmExtendedData'
        type: object
      title: Virtual Machine
      type: object
      x-discriminator-value: VMWARE_VIRTUAL_MACHINE
    VmExtendedData:
      description: Virtual Machine (VM) Extended Data.
      properties:
        backupId:
          description: An opaque identifier used to represent the entire Virtual Machine (VM) backup that contains a full backup of this database.
          type: string
        dataMoverType:
          description: This attribute is to track which data mover was used to create the copy.
          enum:
          - INHERIT_FROM_POLICY
          - SDM
          - VADP
          type: string
        diskBackupCount:
          description: The number of disks that have been backed up as part of this backup.
          format: int64
          type: integer
        diskTotalCount:
          description: The total number of disks for the Virtual Machine (VM).
          format: int64
          type: integer
        disks:
          items:
            properties:
              backupIndex:
                format: int64
                type: integer
                x-ppdm-filter: true
                x-ppdm-sort: true
              capacityInBytes:
                format: int64
                type: integer
              controller:
                format: int64
                type: integer
              controllerType:
                $ref: '#/components/schemas/DiskControllerType'
              datastoreMoref:
                description: The moref of the datastore where the VMDK was stored.
                type: string
              eagerlyScrub:
                description: Flag indicates if the disk was eagerly zeroed when provisioned.
                type: boolean
              excluded:
                description: It means if this disk is treated as backup target.
                type: boolean
              key:
                format: int64
                type: integer
              label:
                type: string
              provisioningType:
                $ref: '#/components/schemas/DiskProvisioningType'
              storagePolicyId:
                description: The UUID of vCenter storage policy assigned to this disk.
                type: string
              thinProvisioned:
                description: Flag indicates if the disk was thin provisioned.
                type: boolean
              unitNumber:
                format: int64
                type: integer
              usedBytes:
                description: Indicates the amount of space, in bytes, that is in use on the virtual disk.
                format: int64
                type: integer
            type: object
            x-tags:
            - Resource
          type: array
        networks:
          items:
            properties:
              networkKey:
                type: integer
              networkLabel:
                type: string
              networkMoref:
                type: string
            type: object
            x-tags:
            - Resource
          type: array
        quiesceStatus:
          enum:
          - NONE
          - FULL
          - COPY
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        storagePolicyId:
          description: The UUID of vCenter storage policy assigned to the Virtual Machine (VM) and any non-disk files.
          type: string
        syntheticFull:
          description: A flag indicating whether this copy is a Synthetic Full or a Full (level 0) backup.
          type: boolean
        transportModeUsed:
          $ref: '#/components/schemas/TransportMode'
      title: Virtual Machine Extended Data
      type: object
      x-tags:
      - Resource
    VmwVirtualMachineOptions:
      properties:
        anomalyDetectionEnabled:
          description: Indicates whether anomaly detection is enabled at the policy level for all the assets. This option can be enabled only when indexingEnabled is enabled.
          type: boolean
          x-ppdm-filter: true
          x-ppdm-sort: true
        appConsistentProtection:
          description: If value is true then VM's and Database copies are found then correlate, perform application consistent backups on this virtual machine.
          type: boolean
          x-ppdm-filter: true
          x-ppdm-sort: true
        backupMode:
          description: Indicate the backup mode for the asset in protection-policy. FSS - Fixed Size Segment, VSS - Variable Size Segment.
          enum:
          - FSS
          - VSS
          type: string
          x-ppdm-filter: true
          x-ppdm-sort: true
        debugEnabled:
          description: Indicates if logs need to enable DEBUG mode or not. Defaults to false, if no value is provided.
          type: boolean
          x-ppdm-filter: true
          x-ppdm-sort: true
        disableQuiescing:
          description: Indicates whether to turn off the quiescing snapshot for Virtual Machine (VM) backups, the default value is false. This option is available only for the primary backup stage of Virtual Machine (VM) Crash Consistent policy.
          type: boolean
          x-ppdm-filter: true
          x-ppdm-sort: true
        excludeSwapFiles:
          description: Indicates whether the protection policy is configured with 'excludeSwapFiles'.
          type: boolean
          x-ppdm-filter: true
          x-ppdm-sort: true
        indexingEnabled:
          description: Indicates whether the metadata indexing is enabled.
          type: boolean
          x-ppdm-filter: true
          x-ppdm-sort: true
      title: VmwVirtualMachineOptions
      type: object
    VmwVirtualMachineProtectionPolicy:
      allOf:
      - $ref: '#/components/schemas/ProtectionPolicyCommon'
      - properties:
          objectives:
            description: The objectives.
            items:
              $ref: '#/components/schemas/ProtectionVmwVirtualMachineObjective'
            type: array
        type: object
      title: PublicVmwVirtualMachinePolicy
      type: object
      x-discriminator-value: VMWARE_VIRTUAL_MACHINE
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: "For accessing the API, a valid JWT token must be passed in all the queries in the 'Authorization' header with the 'Bearer' HTTP authorization schema: \n\n\t'Authorization: Bearer <JWT_token>'"
      scheme: bearer
      type: http
info:
  contact:
    name: ''
  description: PowerProtect Data Manager Public RESTful API
  title: PowerProtect Data Manager V3
  version: v3
openapi: 3.0.1
paths:
  /api/v3/activities:
    get:
      description: 'Retrieves a list of all activities. Passing query parameters that are not documented on this page will result in a 400 error when strict REST API validation is enabled. Additional information can be found in the Getting started - Strict REST API validation documentation.

        > This endpoint supports execution by the following roles: Administrator, User, Backup Administrator, Restore Administrator

        '
      operationId: getAllActivities
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/orderby'
      - $ref: '#/components/parameters/queryState'
      - $ref: '#/components/parameters/searchTerm'
      - $ref: '#/components/parameters/groupBy'
      - $ref: '#/components/parameters/view'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitiesPage'
          description: Successfully retrieved a page of all the activities.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The request is invalid due to incorrect or malformed input. Verify that all the input data is correct and properly formatted before making the request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The request lacks any valid authentication credentials. This error occurs when the provided bearer token is missing, expired, or invalid. Ensure that a valid token is in the Authorization header of the request.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: An unexpected server error occurred while attempting to retrieve the activities. This could be due to various issues on the server side. Retry the request later or contact support if the problem persists.
      security:
      - BearerAuth: []
      summary: Get all activities
      tags:
      - Activity
      x-ppdm-executable-roles: admin,readonly,backup_admin,restore_admin
    parameters: []
  /api/v3/activities/{id}:
    get:
      description: 'Retrieve the detailed information about a specific activity by supplying its unique identifier. This API returns the activity''s relevant data which is essential for monitoring the activity. Passing query parameters that are not documented on this page will result in a 400 error when strict REST API validation is enabled. Additional information can be found in the Getting started - Strict REST API validation documentation.

        > This endpoint supports execution by the following roles: Administrator, User, Backup Administrator, Restore Administrator

        '
      operationId: getActivityById
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: Successfully retrieved an activity and returned the activity information.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The request lacks any valid authentication credentials. This error occurs when the provided bearer token is missing, expired, or invalid. Ensure that a valid token is in the Authorization header of the request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requested resource is not found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: An unexpected server error occurred while attempting to retrieve an activity. This could be due to various issues on the server side. Retry the request later or contact support if the problem persists.
      security:
      - BearerAuth: []
      summary: Get an activity using a unique identifier
      tags:
      - Activity
      x-ppdm-executable-roles: admin,readonly,backup_admin,restore_admin
    parameters:
    - description: The activity ID.
      in: path
      name: id
      required: true
      schema:
        type: string
  /api/v3/activities/{id}/cancel:
    parameters:
    - description: The activity ID.
      in: path
      name: id
      required: true
      schema:
        type: string
    post:
      description: 'Cancel a specific activity using the activity''s unique identifier in the path parameter. This API is used to halt an activity that is currently running or scheduled but needs to be stopped. Passing query parameters that are not documented on this page will result in a 400 error when strict REST API validation is enabled. Additional information can be found in the Getting started - Strict REST API validation documentation.

        > This endpoint supports execution by the following roles: Administrator, Backup Administrator, Restore Administrator

        '
      operationId: cancelActivity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelActivityRequestCommonBody'
        required: false
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityInterventionResponse'
          description: Successfully accepted and initiated the cancellation operation for the provided activity ID.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The request is invalid due to incorrect or malformed input. Verify that all input data is correct and properly formatted before making the request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The request lacks any valid authentication credentials. This error occurs when the provided bearer token is missing, expired, or invalid. Ensure that a valid token is in the Authorization header of the request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requested resource is not found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: An unexpected server error occurred while attempting to cancel the activity. This could be due to various issues on the server side. Retry the request later or contact support if the problem persists.
      security:
      - BearerAuth: []
      summary: Cancel a specified activity by ID
      tags:
      - Activity
      x-ppdm-executable-roles: admin,backup_admin,restore_admin
  /api/v3/activities/{id}/retry:
    parameters:
    - description: The activity ID.
      in: path
      name: id
      required: true
      schema:
        type: string
    post:
      description: 'Retry a specified activity by supplying its unique identifier. This API is useful for retrying activities that may have previously failed or were incomplete. Passing query parameters that are not documented on this page will result in a 400 error when strict REST API validation is enabled. Additional information can be found in the Getting started - Strict REST API validation documentation.

        > This endpoint supports execution by the following roles: Administrator, Backup Administrator, Restore Administrator

        '
      operationId: retryActivity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryActivityRequestCommonBody'
        required: false
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityInterventionResponse'
          description: Successfully accepted and initiated the retry operation for the provided activity ID.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The request is invalid due to incorrect or malformed input. Verify that all input data is correct and properly formatted before making the request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The request lacks any valid authentication credentials. This error occurs when the provided bearer token is missing, expired, or invalid. Ensure that a valid token is in the Authorization header of the request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requested resource is not found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: An unexpected server error occurred while attempting to retry the activity. This could be due to various issues on the server side. Retry the request later or contact support if the problem persists.
      security:
      - BearerAuth: []
      summary: Retry a specific activity by ID
      tags:
      - Activity
      x-ppdm-executable-roles: admin,backup_admin,restore_admin
  /api/v3/activities/{id}/steps:
    get:
      description: 'Retrieve the detailed activity steps for a given activity by specifying its unique activity ID, This API provides an organized and comprehensive view of all steps associated with a specific activity. Passing query parameters that are not documented on this page will result in a 400 error when strict REST API validation is enabled. Additional information can be found in the Getting started - Strict REST API validation documentation.

        > This endpoint supports execution by the following roles: Administrator, User, Backup Administrator, Restore Administrator

        '
      operationId: getActivitySteps
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/orderby'
      - $ref: '#/components/parameters/queryState'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityStepsPage'
          description: Successfully retrieved a page of the activity steps for the specified activity.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The request is invalid due to incorrect or malformed input. Verify that all input data is correct and properly formatted before making the request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The request lacks any valid authentication credentials. This error occurs when the provided bearer token is missing, expired, or invalid. Ensure that a valid token is in the Authorization header of the request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requested resource is not found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: An unexpected server error occurred while attempting to retrieve the activity steps. This could be due to various issues on the server side. Retry the request later or contact support if the problem persists.
      security:
      - BearerAuth: []
      summary: Get the activity steps for the specified activity
      tags:
      - Activity Step
      x-ppdm-executable-roles: admin,readonly,backup_admin,restore_admin
    parameters:
    - description: The activity ID.
      in: path
      name: id
      required: true
      schema:
        type: string
  /api/v3/activities/{id}/steps/{stepId}:
    get:
      description: 'Retrieve detailed information of a specific step of an activity, identified by the unique activity ID and step ID. It allows users to fetch and view the exact details of a particular step. Passing query parameters that are not documented on this page will result in a 400 error when strict REST API validation is enabled. Additional information can be found in the Getting started - Strict REST API validation documentation.

        > This endpoint supports execution by the following roles: Administrator, User, Backup Administrator, Restore Administrator

        '
      operationId: getActivityStepById
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityStep'
          description: Successfully retrieved the detailed information about a specific activity step of an activity.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The request lacks any valid authentication credentials. This error occurs when the provided bearer token is missing, expired, or invalid. Ensure that a valid token is in the Authorization header of the request.
        '404':
          content:
            application/json:
